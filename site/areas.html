<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 영역 | Hunt Bae's Works</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.area{display:grid;grid-template-columns:90px 1.1fr 1.4fr 1.4fr;gap:28px;padding:30px 0;border-top:1px solid var(--line);align-items:start}
.area .n{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--gold)}
.area h3{font-size:21px}
.area .lbl{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.area p{margin:0;color:var(--ink-2)}
.area .exp{color:var(--navy);font-weight:600}
@media (max-width:860px){.area{grid-template-columns:56px 1fr;gap:10px 18px}.area>div:nth-child(n+3){grid-column:2}}
</style>
</head>
<body data-page="areas">
<div class="topbar" data-topbar="services/areas"></div>
<header class="phero"><div class="wrap">
  <span class="eyebrow">All Areas</span>
  <h1 class="h-xl">직접 해 본 일만 적었습니다.</h1>
  <p>1인 기업가로 직접 해 본 일만 모은 10개 영역입니다. 해 보지 않은 일은 적지 않았습니다. 진단 신청 시 해당 항목을 고르시면 맞는 상품과 견적을 안내합니다.</p>
</div></header>
<main class="wrap" style="padding:40px 24px 30px"><div id="areaList"></div></main>
<section class="tight" style="padding-bottom:88px"><div class="wrap"><div class="cta rv"><div><h2>어떤 영역인지 모르겠다면</h2><p>진단 신청서에서 ‘잘 모르겠음’을 고르시면 됩니다. 24시간 안에 맞는 상품과 예상 비용을 1쪽 진단서로 보내 드립니다.</p></div><a class="btn btn-gold arrow" data-link="diag" href="#">무료 AI 진단 받기</a></div></div></section>
<footer class="foot" data-footer></footer>
<script src="assets/site.js"></script>
<script>
var AREAS=[
["창업·사업기획","아이템 검증, 비즈모델 설계, 사업계획서, 투자설명서(IR), 시장·경쟁 분석","사업계획서를 여섯 번 고쳐 가며 회사를 만들었고, 투자설명서와 IR 발표를 직접 했습니다"],
["창업지원사업","예비·초기창업패키지, 청년창업사관학교, 공개SW 창업지원 신청 코칭, 발표 리허설","창업지원사업으로 창업해 선정·수행했고, 지금은 평가위원 자리에도 앉습니다"],
["정부 R&D 전주기","과제 발굴, 기획서·연구개발계획서, 컨소시엄 구성, 사업비 집행·정산, 평가 대응","1998년부터 부처별 R&D를 기획·수주·수행·정산했습니다"],
["경영관리 자동화","매출·지출·송장·재고 엑셀 모델, AI 자동 분류, 월 결산, 급여·4대보험 일정","법인 다섯 곳의 장부와 급여를 혼자 처리합니다"],
["콘텐츠·SNS 운영","유튜브 기획·AI 영상·썸네일, 인스타·스레드 운영, 쇼츠·카드뉴스, 보도자료·프레스킷","유튜브 채널 여러 개와 릴스·블로그를 AI 파이프라인으로 운영하고, 언론사 편집국장을 지냈습니다"],
["문서·행정 자동화","HWPX·DOCX·PPTX·XLSX 자동 생성, 공공기관 양식, 제안서·보고서 템플릿","한글 문서 자동화 도구를 직접 만들어 공개했습니다"],
["조직·법인 운영","유한회사·사단법인·연구조합·협회·포럼 설립 가이드, 정관·총회 서류, 업종 추가, 통신판매업 신고","과기부·산업부·경찰청 인가 법인을 직접 세우고 23년째 운영합니다"],
["교육·강연·심사","AI 활용 실습 교육, 창업캠프, 강연·토론, 심사·평가, 멘토링","대학생 창업캠프를 운영했고 국회 학술대회에서 발표했습니다"],
["모빌리티·정책","근거리 저속 이모빌리티 제도·인증, 지자체 교통정책, 스마트시티·규제샌드박스 기획","국내 최초 공도주행 인증 사이클카트를 사업화했고 새 차종 제도를 제안 중입니다"],
["해외","한국 정부사업·시장 진입 안내(영문), 동남아 이모빌리티 타당성 조사","메콩 5개국 FS와 동남아 EV 공급 제안을 작성했습니다"]];
var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')};
document.getElementById('areaList').innerHTML=AREAS.map(function(a,i){return '<div class="area rv"><span class="n">'+String(i+1).padStart(2,'0')+'</span><h3>'+esc(a[0])+'</h3><div><div class="lbl">What</div><p>'+esc(a[1])+'</p></div><div><div class="lbl">Experience</div><p class="exp">'+esc(a[2])+'</p></div></div>'}).join('');
</script>
</body>
</html>
